controller_manager:
  ros__parameters:
    update_rate: 50
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    steering_pid_controller:
      type: pid_controller/PidController

steering_pid_controller:
  ros__parameters:
    dof_names:
      - front_right_steering_joint
      - front_left_steering_joint
      - rear_right_steering_joint
      - rear_left_steering_joint
    command_interface: velocity
    reference_and_state_interfaces: [position]
    gains:
      front_right_steering_joint: {p: 30.0, i: 0.5, d: 0.1}
      front_left_steering_joint: {p: 30.0, i: 0.5, d: 0.1}
      rear_right_steering_joint: {p: 30.0, i: 0.5, d: 0.1}
      rear_left_steering_joint: {p: 30.0, i: 0.5, d: 0.1}

      # front_right_steering_joint: {p: 1.0, i: 0.0, d: 0.0}
      # front_left_steering_joint: {p: 1.0, i: 0.0, d: 0.0}
      # rear_right_steering_joint: {p: 1.0, i: 0.0, d: 0.0}
      # rear_left_steering_joint: {p: 1.0, i: 0.0, d: 0.0}